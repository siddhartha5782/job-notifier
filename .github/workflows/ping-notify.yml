name: Ping Vercel API Every 20 Minutes

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:        # Allows manual run from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call Job Notifier API
        run: |
          curl -s https://job-notifier-khaki.vercel.app/api/notify
